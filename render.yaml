# One-click deploy on Render: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: helionest-voice-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false            # Render asks you to paste it during setup (never commit it)
      - key: RAG_BACKEND
        value: bm25            # vector RAG needs ~690MB (free plan = 512MB); use "auto" on a paid plan
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: helionest-kv
          property: connectionString

  # Free Redis-compatible store (leads, calls, bookings, live call sessions)
  - type: keyvalue
    name: helionest-kv
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []            # only reachable from our own Render services
